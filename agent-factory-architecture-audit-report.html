      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Architecture thesis&lt;/p&gt;&lt;h2&gt;先讲清本质：这是“Spec-first Agent 编译器”，不是逐个手写 createFunction&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;用户看到的是 Chatbot；系统内部真正被制造的是 GeneratedAgentSpec。Inngest function 的外壳由通用 Runtime 统一生成，AI 生成的是业务规格、Prompt、工具绑定、步骤计划与可选 handler 代码。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-grid af-grid-3&quot;&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;
          &lt;h3&gt;Chatbot = 控制台&lt;/h3&gt;
          &lt;p&gt;自然语言进入 intent gate，经过 SSE 显示每次 think、tool、stage、review、sandbox 和 HITL。对话不是最终制品，而是对 Harness 的持续控制与审计界面。&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;
          &lt;h3&gt;GeneratedAgentSpec = 中间表示&lt;/h3&gt;
          &lt;p&gt;它承载事件触发/产出、system prompt、tool roster、I/O schema、结构化 plan、补偿事件、子 Agent、生成代码与执行模式，是生成面和 Runtime 之间的核心 IR。&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;
          &lt;h3&gt;registerAgent = Inngest 后端&lt;/h3&gt;
          &lt;p&gt;Runtime 从 Manifest 读取 IR，为每个 tenant + agent 调一次通用 &lt;code&gt;createFunction&lt;/code&gt;。因此“造 Function”主要是编译 Manifest 数据，而不是让 LLM 重复生成整套 Inngest 样板代码。&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-callout&quot; style=&quot;margin-top:14px&quot;&gt;&lt;strong&gt;关键澄清：&lt;/strong&gt;生产 Inngest function 的稳定外壳是仓库里的通用 &lt;code&gt;registerAgent()&lt;/code&gt;，不是 LLM 为每个 Agent 重新手写。LLM 生成的 TypeScript 是可选业务 handler；默认/生产主路径仍是“生成 Manifest → 通用 Runtime 解释执行”。这使重试、并发、HITL、事件账本与观测能力集中在同一个 Runtime，而不是散落在每份生成代码里。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-chatbot&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;

        &lt;p&gt;一次会话同时承载自然语言意图、自治运行 trace、人工门控和可恢复状态。UI 只订阅 BrainEvent；后台 run 与 SSE 连接生命周期已经解耦。&lt;/p&gt;

      &lt;div class=&quot;af-grid af-grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;输入如何被理解&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;&lt;code&gt;parseUserIntent&lt;/code&gt; 将当前消息记录为生成 / 修改 / 分析 / 提问 / 报告等开放意图。&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;selectPolicy&lt;/code&gt; 选择 full、skinny、analyze 或 ask_first 流水线形状。&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;tierForContext&lt;/code&gt; 按当前相位在 fast / default / hard 间路由；review 工具显式使用 critic tier。&lt;/li&gt;
            &lt;li&gt;同一 conversation 的追问恢复已有 specs、计划、理解、反思和沙箱证据，不必从头造。&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;输出为何可观测&lt;/h3&gt;
          &lt;p&gt;&lt;code&gt;runBrain&lt;/code&gt; 是 &lt;code&gt;AsyncGenerator&amp;lt;BrainEvent&amp;gt;&lt;/code&gt;。think delta、model、tool.call/result/progress、stage、agent.created、review reflect、sandbox I/O、score.delta、revert 和 done 都是事件，不依赖解析自然语言日志。&lt;/p&gt;
          &lt;p&gt;Web 端从同一事件流派生 transcript、agent cards、workers、business flow、stage rail 和 run summary；&lt;code&gt;forAgent&lt;/code&gt; 让每一步 Harness 工作可下钻到它正在制造的目标 Agent。&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-table-wrap&quot; style=&quot;margin-top:16px&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Chatbot 状态&lt;/th&gt;&lt;th&gt;实现载体&lt;/th&gt;&lt;th&gt;为何属于 Harness&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;已理解的目标&lt;/td&gt;&lt;td&gt;&lt;code&gt;BrainCtx.userIntent&lt;/code&gt;&lt;/td&gt;&lt;td&gt;让后续轮次知道是在生成、分析还是定点修改，避免每条消息都跑全流程&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;业务世界模型&lt;/td&gt;&lt;td&gt;&lt;code&gt;ontology&lt;/code&gt; + &lt;code&gt;ontologyUnderstanding&lt;/code&gt;&lt;/td&gt;&lt;td&gt;原始事实与 AI 消化结论同时保留，既可校验又可推理&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;制造中间产物&lt;/td&gt;&lt;td&gt;&lt;code&gt;currentPlan&lt;/code&gt; + &lt;code&gt;specs[]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;对话可以查询、修改、补全某一个 Agent，而不是只保留聊天文本&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;自我修改历史&lt;/td&gt;&lt;td&gt;&lt;code&gt;attemptHistory[action]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;每次 refine 保存完整快照、批评、score delta，可回滚与检测收敛&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;人工决策门&lt;/td&gt;&lt;td&gt;&lt;code&gt;awaitingApproval / Boundary / Clarify&lt;/code&gt;&lt;/td&gt;&lt;td&gt;测试用例、外部边界与未知凭据不会由模型静默代替用户决定&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;执行证据&lt;/td&gt;&lt;td&gt;&lt;code&gt;lastValidation / lastSandbox&lt;/code&gt;&lt;/td&gt;&lt;td&gt;finish 读取结构化证据，而不是相信模型说“已经完成”&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;跨运行经验&lt;/td&gt;&lt;td&gt;&lt;code&gt;priorReflections&lt;/code&gt; + policy stats&lt;/td&gt;&lt;td&gt;失败原因和保真违约会影响下一次生成路线与审查深度建议&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-harness&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Harness engineering&lt;/p&gt;&lt;h2&gt;四层 Harness：主控、认知分治、设计内环、运行时嵌套&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;系统并不是“一个 Prompt + 40 个工具”。它用同一推理基础设施形成多种上下文隔离层：重型递归子脑、轻型并行专家、单 Agent 设计自审，以及目标 Agent 自己的 Runtime Harness。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-diagram&quot; role=&quot;img&quot; aria-label=&quot;Agent Factory 四层 Harness 架构&quot;&gt;
        &lt;svg viewBox=&quot;0 0 1240 590&quot; preserveAspectRatio=&quot;xMidYMid meet&quot;&gt;
          &lt;title&gt;Agent Factory 四层 Harness&lt;/title&gt;

          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;阶段状态机&lt;/td&gt;&lt;td&gt;&lt;code&gt;stageAdmission()&lt;/code&gt; 强制 read→plan→design→validate→sandbox→deliver 的最低入口条件&lt;/td&gt;&lt;td&gt;阶段内工具顺序由 ReAct 大脑决定&lt;/td&gt;&lt;td&gt;拒绝跳段并把结构化原因喂回下一轮&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;意图/路线&lt;/td&gt;&lt;td&gt;intent 分类与 policy 规则可测&lt;/td&gt;&lt;td&gt;deep=true 是否启用分治由 AI 根据事实决定&lt;/td&gt;&lt;td&gt;未知意图走 full 安全默认&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;认知专家&lt;/td&gt;&lt;td&gt;固定维度、JSON 契约、并行 fan-out/reduce&lt;/td&gt;&lt;td&gt;每个专家在独立上下文做语义判断&lt;/td&gt;&lt;td&gt;过半成功即可综合；否则降级单跳或确定性骨架&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;设计自审&lt;/td&gt;&lt;td&gt;检查分支、规则泄漏、事件幻觉等&lt;/td&gt;&lt;td&gt;命中 hard issue 后由 review 模型针对性重写 prompt/logic&lt;/td&gt;&lt;td&gt;最多一次；失败保留原稿，不让内环无限自改&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;外层返修&lt;/td&gt;&lt;td&gt;snapshot、score delta、预算、收敛检测、回滚&lt;/td&gt;&lt;td&gt;大脑读取 review/sandbox 结果后决定 refine、re-plan 或 split&lt;/td&gt;&lt;td&gt;单 Agent 4 次、全域约 3×Agent 数；两轮 Δ&amp;lt;5 停止磨损&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Runtime 子 Agent&lt;/td&gt;&lt;td&gt;深度、lint、尝试数、工具模式受控&lt;/td&gt;&lt;td&gt;父 Agent 可按运行数据临时生成子 handler&lt;/td&gt;&lt;td&gt;最多 2 次 generate→lint，运行失败返回结构化 error&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-generation&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Agent generation pipeline&lt;/p&gt;&lt;h2&gt;Agent 是怎样被“造出来”的：从本体事实到可执行 IR&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;生成不是一次 Prompt 完成，而是先建立事实底座，再形成计划、逐 Agent 设计、编译代码、做多层审查，最后用真实 Inngest 运行证据决定是否返修。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-grid af-grid-2&quot;&gt;
        &lt;ol class=&quot;af-flow-list&quot;&gt;
          &lt;li&gt;&lt;strong&gt;read_ontology：建立事实底座&lt;/strong&gt;&lt;span&gt;读取 actions/events/rules/objects，生成 event-flow digest、tool catalog、rulesByAction 与 canonical event_data。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;understand_ontology：把“读到”变成“读懂”&lt;/strong&gt;&lt;span&gt;小域单跳理解；复杂域可派四位认知专家按对象/规则/动作/事件并行，再综合进 ontologyUnderstanding。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;capability_resolve：先选型再制造&lt;/strong&gt;&lt;span&gt;对照已有 Fleet functions、skills 和 ontology tools，为每个 Agent action 给出复用/组合/新造判断。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;create_plan：形成 BuildPlan&lt;/strong&gt;&lt;span&gt;按事件链列出每个 Agent 的职责、触发、产出、工具候选、边界条件和跨 Agent 注意点，并做确定性覆盖检查。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;critique_plan：独立挑战分解&lt;/strong&gt;&lt;span&gt;单 reviewer 或链路/规则/契约三视角并行审查；高危问题要求 create_plan version+1。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;design_agent：生成核心 IR&lt;/strong&gt;&lt;span&gt;模型亲自给一个 action 写 system prompt、decision logic、工具理由、typed I/O、structured plan 和 compensation_event。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;设计内环：自动修第一轮&lt;/strong&gt;&lt;span&gt;deterministic self-check 命中 hard issue 时自动调用 internalDesignRefine，只重写 prompt/decision logic 一次。&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
        &lt;ol class=&quot;af-flow-list&quot; start=&quot;8&quot;&gt;
          &lt;li&gt;&lt;strong&gt;工具与规则 Grounding&lt;/strong&gt;&lt;span&gt;工具名映射到真实 catalog；空工具按语义补底；规则闸强制加入 ontology.fetchActionRules 和动态抓规则指令。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;I/O 与状态 Grounding&lt;/strong&gt;&lt;span&gt;AI schema 与 canonical event_data 合并；deriveStateBindings 从 trigger payload 和 emit state_mutations 推导对象读写意图。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Plan 校验&lt;/strong&gt;&lt;span&gt;每个 tool/invoke 步要求稳定 idempotencyKeyFrom 与 onError；dependsOn 只能引用此前步骤；不合格直接拒绝提交。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;代码生成&lt;/strong&gt;&lt;span&gt;默认 specToAgentCode 生成 defineAgent handler；也可 codegen_agent 用 AI 完整覆盖；两者都进入编译/安全/加载探针。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;三重生成期审查&lt;/strong&gt;&lt;span&gt;review_agent 查设计与代码；review_context 查本体语义与上下游契约；review_completeness 查覆盖、分支和运行时事实。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;静态编译验证&lt;/strong&gt;&lt;span&gt;validate_graph 检查动作覆盖、事件闭合、工具存在、合同提醒，并生成业务流模型。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;动态验证与交付&lt;/strong&gt;&lt;span&gt;测试用例经用户确认后 sandbox_run；失败归因到具体 Agent；通过十项 acceptance 后保存草稿，显式 promote 才进入生产。&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-section-head&quot; style=&quot;margin-top:30px&quot;&gt;
        &lt;div&gt;&lt;h3&gt;GeneratedAgentSpec：生成系统的核心 IR&lt;/h3&gt;&lt;/div&gt;
        &lt;p&gt;这层把 LLM 的自由推理收敛为 Runtime 能验证、编译和运行的结构化合同。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-table-wrap&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;IR 字段&lt;/th&gt;&lt;th&gt;来源&lt;/th&gt;&lt;th&gt;编译/审查作用&lt;/th&gt;&lt;th&gt;进入 Runtime 后&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;slug / short / actionName&lt;/code&gt;&lt;/td&gt;&lt;td&gt;domain + ontology action&lt;/td&gt;&lt;td&gt;稳定标识、覆盖、碰撞与 review 定位&lt;/td&gt;&lt;td&gt;Manifest id/name；最终 function id = tenantSlug.agentName&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;trigger / emit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;ontology action&lt;/td&gt;&lt;td&gt;事件图、入口/终态、branch review&lt;/td&gt;&lt;td&gt;Inngest namespaced triggers；finalize 选择并 sendEvent&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;systemPrompt / decisionLogic&lt;/code&gt;&lt;/td&gt;&lt;td&gt;LLM authored + inner refine&lt;/td&gt;&lt;td&gt;三重审查、代码渲染、规则泄漏检查&lt;/td&gt;&lt;td&gt;ontology_instructions；生成式 logic action 的决策核心&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;tools / unresolvedTools&lt;/code&gt;&lt;/td&gt;&lt;td&gt;tool catalog grounding&lt;/td&gt;&lt;td&gt;防工具幻觉、能力补底、acceptance&lt;/td&gt;&lt;td&gt;tool_use overlay；tenant → declarative → global resolution&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;inputSchema / outputSchema&lt;/code&gt;&lt;/td&gt;&lt;td&gt;AI annotations + canonical event_data&lt;/td&gt;&lt;td&gt;contract graph、执行保真、UI I/O&lt;/td&gt;&lt;td&gt;用于合同与证据，不直接生成 TypeScript runtime validator&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;plan[]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;LLM structured plan&lt;/td&gt;&lt;td&gt;幂等、失败策略、依赖与 invoke 校验&lt;/td&gt;&lt;td&gt;一项一项投影成 Manifest actions；每项一个 durable step&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;generatedCode&lt;/code&gt;&lt;/td&gt;&lt;td&gt;deterministic renderer 或 codegen_agent&lt;/td&gt;&lt;td&gt;compile + AST lint + load probe + code review&lt;/td&gt;&lt;td&gt;typescript_code；满足 codeExecuted 时尝试 CodeAct&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;compensationEvent&lt;/code&gt;&lt;/td&gt;&lt;td&gt;设计者按副作用判断&lt;/td&gt;&lt;td&gt;副作用无补偿会被提示&lt;/td&gt;&lt;td&gt;硬失败时以幂等 step.sendEvent 发补偿事件&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;isSubAgent / parentAction&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design_subagent&lt;/td&gt;&lt;td&gt;不计 ontology coverage，但必须有父 invoke&lt;/td&gt;&lt;td&gt;单独注册 function，由父 plan 的 step.invoke 同步调用&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;codeExecuted / probeReason&lt;/code&gt;&lt;/td&gt;&lt;td&gt;代码三门结果&lt;/td&gt;&lt;td&gt;区分可执行代码与声明式降级&lt;/td&gt;&lt;td&gt;记录 runs.code_ran；finish 检查是否真跑而非 fallback&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-callout&quot; style=&quot;margin-top:14px&quot;&gt;&lt;strong&gt;生成代码的真实含义：&lt;/strong&gt;&lt;code&gt;specToAgentCode()&lt;/code&gt; 生成的是一个 &lt;code&gt;defineAgent({ handler })&lt;/code&gt; 业务模块，包含专属 system prompt、工具注释、reason/emit 分支和 I/O interface；它不是完整的 Inngest &lt;code&gt;createFunction&lt;/code&gt;。真正的 durable wrapper、数据库落盘、step.run、waitForEvent、step.invoke、event ledger 和 sendEvent 全由 Runtime 的通用 &lt;code&gt;registerAgent()&lt;/code&gt; 提供。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-review-loop&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Review &amp; auto-revision&lt;/p&gt;&lt;h2&gt;生成、审查、自动修改：五个嵌套反馈环&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;系统既有代码内直接触发的自动修改，也有由外层 ReAct 大脑根据结构化 review 结果选择的返修。两者需要区分：前者是控制器保证，后者仍是模型策略。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-diagram&quot; role=&quot;img&quot; aria-label=&quot;Agent 生成审查自动修改闭环&quot;&gt;
        &lt;svg viewBox=&quot;0 0 1240 600&quot; preserveAspectRatio=&quot;xMidYMid meet&quot;&gt;
          &lt;title&gt;Agent 生成、审查与自动修改闭环&lt;/title&gt;
          &lt;desc&gt;从设计草稿、内部自检、代码三门、三重审查、静态验证到真实沙箱；问题通过 refine 或 codegen 回到新版本。&lt;/desc&gt;
          &lt;defs&gt;
            &lt;marker id=&quot;af-review-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M 0 0 L 10 5 L 0 10 z&quot; fill=&quot;#3156d3&quot;&gt;&lt;/path&gt;&lt;/marker&gt;
            &lt;marker id=&quot;af-review-arrow-red&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M 0 0 L 10 5 L 0 10 z&quot; fill=&quot;#b42318&quot;&gt;&lt;/path&gt;&lt;/marker&gt;
          &lt;/defs&gt;
          &lt;rect x=&quot;32&quot; y=&quot;42&quot; width=&quot;178&quot; height=&quot;78&quot; rx=&quot;14&quot; class=&quot;box-accent&quot;&gt;&lt;/rect&gt;
          &lt;text x=&quot;121&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; class=&quot;label&quot;&gt;Design Draft&lt;/text&gt;
          &lt;text x=&quot;121&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; class=&quot;sub&quot;&gt;prompt · logic · plan&lt;/text&gt;

        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;真正自动执行的修改&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;code&gt;designSelfCheck → internalDesignRefine&lt;/code&gt;：命中硬问题就自动重写一次。&lt;/li&gt;
            &lt;li&gt;默认代码 renderer 自动把最新 spec 重新渲染，并重跑 compile/lint/probe。&lt;/li&gt;
            &lt;li&gt;runtime &lt;code&gt;ctx.spawn&lt;/code&gt;：子 Agent 代码未过 lint 时，携带驳回代码和原因再生成，最多两次。&lt;/li&gt;
            &lt;li&gt;sandbox 失败自动计算 fidelity attribution、提出 ontology revision、记录 failure reflection。&lt;/li&gt;
            &lt;li&gt;refine 后自动保存完整旧版本、计算 score delta、清除 lastSandbox，使旧证据失效。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;由外层大脑自治选择的修改&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;critique_plan 有问题后是否 create_plan v+1。&lt;/li&gt;
            &lt;li&gt;三重 review 发现后调用哪个 Agent 的 refine_agent，以及改哪些字段。&lt;/li&gt;
            &lt;li&gt;compile/lint/probe 拒绝顶层 codegen 后是否重写 code 再提交。&lt;/li&gt;
            &lt;li&gt;sandbox 失败后选择 refine、verify_chain、analyze_failure、re-plan 或 split。&lt;/li&gt;
            &lt;li&gt;refine 退步时是否 revert，复杂且收敛停滞时是否 design_subagent。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;

          &lt;text x=&quot;688&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot; class=&quot;sub&quot;&gt;generic function adapter&lt;/text&gt;
          &lt;text x=&quot;688&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot; class=&quot;sub&quot;&gt;per tenant + agent&lt;/text&gt;
          &lt;rect x=&quot;848&quot; y=&quot;222&quot; width=&quot;360&quot; height=&quot;94&quot; rx=&quot;14&quot; class=&quot;box-accent&quot;&gt;&lt;/rect&gt;
          &lt;text x=&quot;1028&quot; y=&quot;251&quot; text-anchor=&quot;middle&quot; class=&quot;label&quot;&gt;Inngest createFunction&lt;/text&gt;
          &lt;text x=&quot;1028&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot; class=&quot;sub&quot;&gt;triggers · concurrency · retries · cancelOn&lt;/text&gt;
          &lt;text x=&quot;1028&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot; class=&quot;sub&quot;&gt;handler(event, step, logger)&lt;/text&gt;
          &lt;path d=&quot;M1096 142 V182 H144 V222&quot; class=&quot;flow&quot; style=&quot;stroke:#3156d3;marker-end:url(#af-inngest-arrow)&quot;&gt;&lt;/path&gt;
          &lt;path d=&quot;M256 269 H304&quot; class=&quot;flow&quot; style=&quot;stroke:#3156d3;marker-end:url(#af-inngest-arrow)&quot;&gt;&lt;/path&gt;
          &lt;path d=&quot;M528 269 H576&quot; class=&quot;flow&quot; style=&quot;stroke:#3156d3;marker-end:url(#af-inngest-arrow)&quot;&gt;&lt;/path&gt;
          &lt;path d=&quot;M800 269 H848&quot; class=&quot;flow&quot; style=&quot;stroke:#3156d3;marker-end:url(#af-inngest-arrow)&quot;&gt;&lt;/path&gt;

          &lt;rect x=&quot;32&quot; y=&quot;384&quot; width=&quot;1176&quot; height=&quot;84&quot; rx=&quot;16&quot; class=&quot;box-warn&quot;&gt;&lt;/rect&gt;
          &lt;text x=&quot;55&quot; y=&quot;414&quot; class=&quot;label&quot;&gt;Execution pass · durable handler&lt;/text&gt;
          &lt;text x=&quot;55&quot; y=&quot;441&quot; class=&quot;sub&quot;&gt;init(run/correlation) → rehydrate payload → ordered actions → step.run / waitForEvent / step.invoke / sendEvent → artifacts + DB + ledger → finalize → downstream event&lt;/text&gt;
          &lt;path d=&quot;M1028 316 V384&quot; class=&quot;flow&quot; style=&quot;stroke:#3156d3;marker-end:url(#af-inngest-arrow)&quot;&gt;&lt;/path&gt;
        &lt;/svg&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-section-head&quot; style=&quot;margin-top:30px&quot;&gt;
        &lt;div&gt;&lt;h3&gt;编译 pass A：mapToManifest 的字段投影&lt;/h3&gt;&lt;/div&gt;
        &lt;p&gt;同一个 mapper 同时被 Sandbox 和 Promote 使用，这是当前实现里最重要的“验证链与交付链复用”设计。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-table-wrap&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Spec&lt;/th&gt;&lt;th&gt;Manifest Agent&lt;/th&gt;&lt;th&gt;作用&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;slug&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;版本中的 Agent 稳定 ID&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;short / nameZh&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;name / title&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Runtime function 名称与 UI 显示名&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;trigger / emit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;trigger / triggered_event&lt;/code&gt;&lt;/td&gt;&lt;td&gt;编译为租户 namespaced Inngest triggers 与下游事件&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;systemPrompt&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;ontology_instructions&lt;/code&gt;&lt;/td&gt;&lt;td&gt;声明式执行和 CodeAct reason 的业务决策上下文&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;generatedCode&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;typescript_code&lt;/code&gt;&lt;/td&gt;&lt;td&gt;可选的业务 handler 代码载荷&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;codeSource/codeExecuted&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;codeExecuted&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Runtime 是否优先尝试生成代码&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;tools&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;tool_use[]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;动态规则工具还会附 domain/action config&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;compensationEvent&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;compensation_event&lt;/code&gt;&lt;/td&gt;&lt;td&gt;硬失败时 Saga 补偿&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;plan[]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;actions[]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;tool/logic/condition/invoke 一步一 action；HITL 先插 manual action&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-section-head&quot; style=&quot;margin-top:30px&quot;&gt;
        &lt;div&gt;&lt;h3&gt;编译 pass B：registerAgent 生成的通用 Function&lt;/h3&gt;&lt;/div&gt;
        &lt;p&gt;这是所有生成 Agent 共享的 Inngest 外壳，也是可靠性工程真正落地的位置。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-grid af-grid-3&quot;&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;Function 配置&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;ID：&lt;code&gt;tenantSlug.agentName&lt;/code&gt;&lt;/li&gt;
            &lt;li&gt;Trigger：&lt;code&gt;tenantSlug/event&lt;/code&gt;&lt;/li&gt;
            &lt;li&gt;Concurrency：tenant + subject&lt;/li&gt;
            &lt;li&gt;Retries：当前固定 3&lt;/li&gt;
            &lt;li&gt;cancelOn：tenant run.cancel + subject&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;Durable Action Adapter&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;tool / logic：&lt;code&gt;step.run(stableStepId)&lt;/code&gt;&lt;/li&gt;
            &lt;li&gt;condition：写 GateState，dependsOn 决定 skip&lt;/li&gt;
            &lt;li&gt;manual：task row + &lt;code&gt;waitForEvent&lt;/code&gt;&lt;/li&gt;
            &lt;li&gt;invoke：&lt;code&gt;step.invoke&lt;/code&gt; sibling function&lt;/li&gt;
            &lt;li&gt;subflow / emit：&lt;code&gt;step.sendEvent&lt;/code&gt;&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;执行证据&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;runs / steps / events / event_store&lt;/li&gt;
            &lt;li&gt;per-step input/output artifacts&lt;/li&gt;
            &lt;li&gt;provider/model/tokens/tool calls&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;runs.code_ran&lt;/code&gt; execution receipt&lt;/li&gt;
            &lt;li&gt;ledger + causation/correlation&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-table-wrap&quot; style=&quot;margin-top:16px&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Logic 执行模式&lt;/th&gt;&lt;th&gt;触发条件&lt;/th&gt;&lt;th&gt;实际行为&lt;/th&gt;&lt;th&gt;反馈证据&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Tenant Prompt&lt;/td&gt;&lt;td&gt;手写 tenant registry 存在同名 prompt&lt;/td&gt;&lt;td&gt;&lt;code&gt;runTenantPrompt&lt;/code&gt;，可进入工具调用循环&lt;/td&gt;&lt;td&gt;model/token/toolCalls&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Generated Code / CodeAct&lt;/td&gt;&lt;td&gt;&lt;code&gt;generated &amp;&amp; codeExecuted &amp;&amp; typescriptCode&lt;/code&gt;，且 Sandbox guard 放行&lt;/td&gt;&lt;td&gt;transpile → capture defineAgent → 调真实 handler；ctx.reason/tool/emit/memory/spawn&lt;/td&gt;&lt;td&gt;&lt;code&gt;meta.codeExecuted=true&lt;/code&gt; → &lt;code&gt;runs.code_ran&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Generated Declarative&lt;/td&gt;&lt;td&gt;代码未启用、未通过或 runGeneratedCode 返回 null&lt;/td&gt;&lt;td&gt;用 ontology_instructions 构造生成式 prompt，Runtime 解释 tools/actions&lt;/td&gt;&lt;td&gt;普通 step I/O；code_ran=false&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Strict missing prompt&lt;/td&gt;&lt;td&gt;非 generated 且没有 tenant prompt&lt;/td&gt;&lt;td&gt;boot-time 检查拒绝注册；热路径仍 fail loud&lt;/td&gt;&lt;td&gt;missing_tenant_prompt&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-callout&quot; style=&quot;margin-top:14px&quot;&gt;&lt;strong&gt;自动修改如何更新 Function：&lt;/strong&gt;&lt;code&gt;refine_agent&lt;/code&gt; 或 &lt;code&gt;codegen_agent&lt;/code&gt; 修改 spec 后会清空 lastSandbox；下一次 sandbox_run 重新 mapToManifest → validate → commit → hot-swap 同一个稳定 function ID。Inngest 看到的是同 ID 的新 Manifest/handler 版本，真实 runs/steps/events 再成为下一轮审查输入。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-harness-assessment&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Deep technical assessment&lt;/p&gt;&lt;h2&gt;对当前 Harness Engineering 的技术判断&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;当前系统已经超过“Prompt 流水线”，但还没有完全成为一个结构化的自主软件工程控制器。它最强的部分是 IR、Runtime adapter 与真实证据回路；最薄弱的部分是 review ledger、代码修订一致性和 Sandbox/生产执行同构。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-grid af-grid-2&quot;&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;
          &lt;h3&gt;实现得很好的地方&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;Spec-first：&lt;/strong&gt;业务自由度留给 LLM，可靠性能力集中在通用 Runtime。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;双层认知 Harness：&lt;/strong&gt;light specialists 适合并行维度分治，heavy sub-brain 适合多轮调查，成本/污染边界清楚。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;设计内环前移：&lt;/strong&gt;确定性 hard issue 触发一次定点重写，避免所有错误都拖到 Sandbox。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;生成期三透镜：&lt;/strong&gt;设计/代码、上下文、完整性分别审，覆盖传统单 reviewer 容易混在一起的问题。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;真实反馈：&lt;/strong&gt;不是只做 graph/lint；会注册 Inngest、发事件、等链路、还原真实 I/O 和 code execution receipt。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;返修防磨损：&lt;/strong&gt;snapshot、delta、回滚、per-agent/global budget、convergence 与“卡住才拆”形成了工程化反思边界。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;可部署嵌套：&lt;/strong&gt;design_subagent 把子任务变成真正的 sibling function + step.invoke，而不是只在 Prompt 里假装有子 Agent。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card af-negative&quot;&gt;
          &lt;h3&gt;最关键的架构缺口&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;三重 Review 不是硬状态机：&lt;/strong&gt;system prompt 要求必跑，但 stageAdmission 与 finish 不检查三项是否执行、是否清零。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;顶层代码没有自动 Patch 闭环：&lt;/strong&gt;codegen_agent 编译/lint/probe 失败只返回错误；需要外层 LLM 自己重写。只有 runtime ctx.spawn 有“带失败代码和原因再生成”的真正 repair loop。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;refine 与 AI code 可能漂移：&lt;/strong&gt;refine_agent 修改 prompt/tools/schema，但 &lt;code&gt;codeSource=ai&lt;/code&gt; 时不会重写 generatedCode；规格与 handler 可变成两个版本。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;生产与 Sandbox 执行不一致：&lt;/strong&gt;生成 TypeScript 仅在 &lt;code&gt;-sb&lt;/code&gt; CodeAct 路径运行；Promote 后真实 tenant 回退声明式。因此 Sandbox 对代码的证明不能证明生产实际行为。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;自动 renderer 的语义矛盾：&lt;/strong&gt;codegen 注释称脚手架“不直接运行”，但 renderExecutableCode 通过三门后会把它标为 codeExecuted 并在 Sandbox 真跑。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;审查结果缺版本化 Ledger：&lt;/strong&gt;findings 主要停留在 tool result/message；没有 reviewer identity、spec version、resolvedBy、patchId 和 pass digest。&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Factory 自身还不是 Durable Workflow：&lt;/strong&gt;输出 Agent 用 Inngest durable steps，制造它们的 runBrain 却仍在进程内 Promise/Map 中运行。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-section-head&quot; style=&quot;margin-top:30px&quot;&gt;
        &lt;div&gt;&lt;h3&gt;“自动化”目前分成四种强度&lt;/h3&gt;&lt;/div&gt;
        &lt;p&gt;这能避免把所有模型行为都称为自动工程控制。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-table-wrap&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;强度&lt;/th&gt;&lt;th&gt;当前机制&lt;/th&gt;&lt;th&gt;保证程度&lt;/th&gt;&lt;th&gt;典型例子&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;结构性自动&lt;/td&gt;&lt;td&gt;代码直接调用、门控或编译器拒绝&lt;/td&gt;&lt;td&gt;只要路径被执行就可保证&lt;/td&gt;&lt;td&gt;stageAdmission、plan validator、compile/lint/probe、fingerprint、acceptance&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;控制器内自动&lt;/td&gt;&lt;td&gt;代码检测问题后直接发起一次 LLM 修订&lt;/td&gt;&lt;td&gt;有限次数、结果再被确定性检查&lt;/td&gt;&lt;td&gt;internalDesignRefine、runtime spawn repair loop&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ReAct 自治自动&lt;/td&gt;&lt;td&gt;模型读 tool result 后决定下一工具&lt;/td&gt;&lt;td&gt;依赖 system prompt、模型能力与上下文连续性&lt;/td&gt;&lt;td&gt;review → refine → re-review，sandbox → attribution → refine&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Human-gated&lt;/td&gt;&lt;td&gt;模型提案，人确认后继续&lt;/td&gt;&lt;td&gt;避免不可逆/未知边界由 AI 单独决策&lt;/td&gt;&lt;td&gt;测试用例、真实数据、boundary events、ask_user、显式 Promote&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;div class=&quot;af-section-head&quot; style=&quot;margin-top:30px&quot;&gt;
        &lt;div&gt;&lt;h3&gt;建议把下一版演进为“Durable Agent Compiler Harness”&lt;/h3&gt;&lt;/div&gt;
        &lt;p&gt;不需要放弃现有 ReAct；要把关键软件工程状态从聊天记录提升为有版本、有证据、有阻断语义的编译产物。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-roadmap&quot;&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Compiler&lt;/div&gt;&lt;small&gt;IR 与版本&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;GeneratedAgentSpecV2 + immutable revision&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;每次 design/refine/codegen 产生新 &lt;code&gt;specRevisionId&lt;/code&gt;，不在原对象原位修改。&lt;/li&gt;
              &lt;li&gt;显式 &lt;code&gt;executionMode=declarative|codeact&lt;/code&gt;，禁止由 codeSource 隐式推断。&lt;/li&gt;
              &lt;li&gt;Plan、Prompt、Tool roster、Code、Ontology hash 各自有 digest，最终组成 bundle digest。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;验收&lt;/strong&gt;&lt;br&gt;任一 review、sandbox run 与 deployment 都能回答“审的是哪一版、运行的是哪一版”。&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Review&lt;/div&gt;&lt;small&gt;审查状态机&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;ReviewLedger + PatchSet&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;三透镜变成 required review types；每条 finding 记录 reviewer、severity、evidence span、target field。&lt;/li&gt;
              &lt;li&gt;reviser 输出结构化 PatchSet，而不是整段重写；apply 后自动重新执行受影响的 reviewer。&lt;/li&gt;
              &lt;li&gt;Sandbox admission 检查当前 revision 的 required reviews 全 pass。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;验收&lt;/strong&gt;&lt;br&gt;缺一项 review、finding 未 resolved 或 patch 未重审，编译器都不能进入 Sandbox。&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Repair&lt;/div&gt;&lt;small&gt;代码自动修复&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;统一 generate → compile → lint → probe → test → patch&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;把 runtime ctx.spawn 的反馈式 repair loop 上移为顶层 CodeRepairEngine。&lt;/li&gt;
              &lt;li&gt;compile/lint/probe/code-review/test 统一返回 machine-readable Diagnostic。&lt;/li&gt;
              &lt;li&gt;refine prompt/tools/schema 后自动标记 code stale，并要求重渲染或 code patch。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;验收&lt;/strong&gt;&lt;br&gt;任何 spec 字段变化都不会留下“旧 handler + 新合同”的组合；修复尝试与最佳版本可回滚。&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Durable&lt;/div&gt;&lt;small&gt;工厂自身&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;用 Inngest/队列承载 Factory Harness&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;HTTP 只创建 FactoryRun；read/plan/design/review/sandbox/deliver 各是 durable steps 或子 functions。&lt;/li&gt;
              &lt;li&gt;HITL 用 waitForEvent；specialists 用 step.invoke/parallel；checkpoint 与事件 journal 原生持久。&lt;/li&gt;
              &lt;li&gt;每个 Agent 的 design/review 可并行，但 contract/graph/sandbox 汇总有明确 barrier。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;验收&lt;/strong&gt;&lt;br&gt;API 重启不丢制造进度；同一 spec revision 的工具/LLM 副作用不会重复；多实例只有一个 durable owner。&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Parity&lt;/div&gt;&lt;small&gt;验证同构&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;Sandbox 与生产运行同一 AgentBundle&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;CodeAct 若是交付模式，就必须在隔离 runner 中同时支持 Sandbox 与生产；若生产只声明式，Sandbox 也只验证声明式。&lt;/li&gt;
              &lt;li&gt;部署前校验 sandbox bundle digest = production bundle digest。&lt;/li&gt;
              &lt;li&gt;生成代码不再由 API/worker 主进程 new Function，改用隔离 worker/container。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;验收&lt;/strong&gt;&lt;br&gt;绿色 Sandbox 证明的正是生产将运行的 adapter、代码、工具与配置。&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-verdict&quot;&gt;
      &lt;div class=&quot;af-verdict&quot;&gt;
        &lt;article class=&quot;af-card af-verdict-main&quot;&gt;
          &lt;p class=&quot;af-eyebrow&quot; style=&quot;color:var(--af-p0);opacity:1&quot;&gt;Executive verdict&lt;/p&gt;
          &lt;h2&gt;不建议以当前形态直接开放共享多租户生产使用&lt;/h2&gt;
          &lt;p&gt;核心业务架构不是“推倒重来”问题。生成控制面、交付边界和运行数据面的分层方向正确，主要风险集中在跨层上下文没有强制贯穿，以及“沙箱”仍是逻辑命名空间而非真正的安全边界。&lt;/p&gt;
          &lt;p&gt;&lt;strong&gt;最短安全路径：&lt;/strong&gt;先封租户所有权、停用主进程生成代码、统一数据根目录和启动密钥校验；随后把 run 与 conversation 分离、改造唯一沙箱和 fail-closed 验收；最后再推进 durable orchestration 与不可变 AgentBundle。&lt;/p&gt;
          &lt;div class=&quot;af-callout&quot;&gt;&lt;strong&gt;快照说明：&lt;/strong&gt;审计期间工作树有其他改动持续落入。本报告以 11:38 CST 的本地快照为准，并已剔除已被并行补丁修复的“恢复缺 tenantSlug / 仅终态持久 transcript”等旧问题。路径行号可能随未提交修改轻微漂移，符号名与代码关系不变。&lt;/div&gt;
        &lt;/article&gt;
        &lt;aside class=&quot;af-card&quot;&gt;
          &lt;h3&gt;本报告归类的问题&lt;/h3&gt;
          &lt;div class=&quot;af-counts&quot; aria-label=&quot;风险数量&quot;&gt;
            &lt;div class=&quot;af-count p0&quot;&gt;&lt;strong&gt;8&lt;/strong&gt;&lt;span&gt;P0 · 发布阻断&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-count p1&quot;&gt;&lt;strong&gt;11&lt;/strong&gt;&lt;span&gt;P1 · 高优先级&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-count p2&quot;&gt;&lt;strong&gt;8&lt;/strong&gt;&lt;span&gt;P2 · 完整性/规模化&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;af-callout&quot;&gt;&lt;strong&gt;分级：&lt;/strong&gt;P0 = 可造成跨租户、凭据、主进程或持久数据风险；P1 = 会导致错误结果、不可恢复、假绿或规模化故障；P2 = 契约、可维护性与长期演进缺口。&lt;/p&gt;
        &lt;/aside&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-current&quot;&gt;

      &lt;div id=&quot;af-layer-detail&quot; class=&quot;af-card&quot; aria-live=&quot;polite&quot;&gt;
        &lt;h3&gt;接入与交互层&lt;/h3&gt;
        &lt;p&gt;Factory UI 将 SSE 事件投影为 transcript、workers、business flow 与 run summary；Next proxy 转发到 Fastify。后台 run 与 SSE 连接已解耦，这是正确方向，但心跳、重连游标、资源所有权仍未形成一套完整协议。&lt;/p&gt;
