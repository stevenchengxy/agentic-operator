    &lt;section id=&quot;af-flow&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;End-to-end path&lt;/p&gt;&lt;h2&gt;从需求到生产执行的 12 步主链路&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;主链路完整，问题主要出现在第 1、7、8、10、12 步：命令语义、沙箱隔离、证据可信度、制品一致性与持久化。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-grid af-grid-2&quot;&gt;
        &lt;ol class=&quot;af-flow-list&quot;&gt;
          &lt;li&gt;&lt;strong&gt;创建或重连&lt;/strong&gt;&lt;span&gt;UI 通过 EventSource GET 携带 domain / goal / conversation，或以 runId 重连。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;注册后台运行&lt;/strong&gt;&lt;span&gt;Fastify route 进入 process-local run-registry；SSE 订阅可关闭而后台 Promise 继续。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;恢复上下文&lt;/strong&gt;&lt;span&gt;runBrain 从 conversation checkpoint 恢复 BrainCtx，执行意图识别、策略路由和阶段门。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;读取本体&lt;/strong&gt;&lt;span&gt;上传本体优先，其次组合 Manifest / Allmeta；构建 ontology anchor 与业务流。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;设计 Agent&lt;/strong&gt;&lt;span&gt;LLM tool-calling 产生 GeneratedAgentSpec：事件合同、计划、工具、代码、补偿与子 Agent。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;静态验证&lt;/strong&gt;&lt;span&gt;图闭合、动作覆盖、字段合同、规则闸绑定、代码 lint 和 critique。&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
        &lt;ol class=&quot;af-flow-list&quot; start=&quot;7&quot;&gt;
          &lt;li&gt;&lt;strong&gt;部署逻辑沙箱&lt;/strong&gt;&lt;span&gt;spec 映射 Manifest，提交到 &amp;lt;domain&amp;gt;-sb，并注册 Inngest app。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;执行生成代码&lt;/strong&gt;&lt;span&gt;Runtime 在同一 Node 进程通过 new Function 执行，名称后缀是唯一“隔离”判断。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;采集真实证据&lt;/strong&gt;&lt;span&gt;轮询 runs / steps / events 与本地 artifact，形成 full-chain、terminal、I/O 和 code receipt。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Acceptance + 草稿&lt;/strong&gt;&lt;span&gt;finish 通过十项验收后写入文件草稿；部分执行保真缺证据时仍可能为 pass。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;显式晋升&lt;/strong&gt;&lt;span&gt;API 将草稿映射成 Manifest，additive merge 当前租户配置，再 validate / commit。&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;生产运行&lt;/strong&gt;&lt;span&gt;Per-tenant Inngest function 调 step-engine / agent-kit，写 SQLite、事件账本和文件制品。&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-boundaries&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;State &amp; trust matrix&lt;/p&gt;&lt;h2&gt;关键状态边界矩阵&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;“API 路由带 tenant”不等于资源已隔离。只有存储键、查询条件、进程内 key、事件 envelope 和执行 artifact 都绑定同一个 TenantContext，边界才闭合。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-table-wrap&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;资源 / 边界&lt;/th&gt;&lt;th&gt;当前键或介质&lt;/th&gt;&lt;th&gt;Tenant 约束&lt;/th&gt;&lt;th&gt;Durable&lt;/th&gt;&lt;th&gt;主要后果&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Active run / SSE / stop&lt;/td&gt;&lt;td&gt;process Map&amp;lt;runId&amp;gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 缺失&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 否&lt;/span&gt;&lt;/td&gt;&lt;td&gt;跨租户订阅、终止、介入；多实例找不到运行&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Conversation checkpoint&lt;/td&gt;&lt;td&gt;factory_conversations.id&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● schema 缺失&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state ok&quot;&gt;● 是&lt;/span&gt;&lt;/td&gt;&lt;td&gt;ID 被当授权；同 ID 可跨租户加载/覆盖&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Factory run history&lt;/td&gt;&lt;td&gt;factory_runs.id = conversationId&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state ok&quot;&gt;● 有 tenant_id&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 覆盖式&lt;/span&gt;&lt;/td&gt;&lt;td&gt;多轮 attempt 不可追溯，旧指标残留&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Draft / policy&lt;/td&gt;&lt;td&gt;FS domain/slug&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 缺失&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 本机 FS&lt;/span&gt;&lt;/td&gt;&lt;td&gt;同域跨租户覆盖、错误晋升&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Reflections / skills / tools&lt;/td&gt;&lt;td&gt;global DB key&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 缺失&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state ok&quot;&gt;● 是&lt;/span&gt;&lt;/td&gt;&lt;td&gt;经验和工具污染，global PK 覆盖&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Uploaded ontology&lt;/td&gt;&lt;td&gt;FS tenant/domain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state ok&quot;&gt;● 已隔离&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 本机 FS&lt;/span&gt;&lt;/td&gt;&lt;td&gt;方向正确；仍受 AGENTIC_DATA_ROOT 配置影响&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Sandbox&lt;/td&gt;&lt;td&gt;&amp;lt;domain&amp;gt;-sb&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● domain 共享&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 部分&lt;/span&gt;&lt;/td&gt;&lt;td&gt;并发部署覆盖、teardown 互删、证据串线&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Generated code&lt;/td&gt;&lt;td&gt;new Function&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 非隔离&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 同进程&lt;/span&gt;&lt;/td&gt;&lt;td&gt;读取环境、网络、阻塞 event loop、内存风险&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;LLM budget / telemetry&lt;/td&gt;&lt;td&gt;Factory 自建 SDK&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 主流缺 tenant&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 部分&lt;/span&gt;&lt;/td&gt;&lt;td&gt;预算不生效、主 ReAct 调用不可完整核算&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Runtime manifest selection&lt;/td&gt;&lt;td&gt;workflow.json / lexical sort&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state ok&quot;&gt;● 租户目录&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 版本选择不可靠&lt;/span&gt;&lt;/td&gt;&lt;td&gt;DB 显示新版本，Runtime 仍加载旧文件&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Artifacts / blobs / cassettes&lt;/td&gt;&lt;td&gt;AGENTIC_DATA_ROOT || ./data&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state warn&quot;&gt;● 路径分散&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;af-state bad&quot;&gt;● 容器可能未挂载&lt;/span&gt;&lt;/td&gt;&lt;td&gt;重建容器后证据、草稿或 payload 丢失&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-findings&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Evidence-backed findings&lt;/p&gt;&lt;h2&gt;27 项问题清单&lt;/h2&gt;&lt;/div&gt;
        &lt;p id=&quot;af-finding-count&quot; aria-live=&quot;polite&quot;&gt;显示全部 27 项。可以按严重级别和模块组合筛选。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-filters&quot; aria-label=&quot;按严重级别筛选&quot;&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;severity&quot; data-filter-value=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部级别&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;severity&quot; data-filter-value=&quot;P0&quot; aria-pressed=&quot;false&quot;&gt;P0 · 8&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;severity&quot; data-filter-value=&quot;P1&quot; aria-pressed=&quot;false&quot;&gt;P1 · 11&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;severity&quot; data-filter-value=&quot;P2&quot; aria-pressed=&quot;false&quot;&gt;P2 · 8&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-filters&quot; aria-label=&quot;按模块筛选&quot;&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部模块&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;security&quot; aria-pressed=&quot;false&quot;&gt;安全与租户&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;control&quot; aria-pressed=&quot;false&quot;&gt;控制面&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;delivery&quot; aria-pressed=&quot;false&quot;&gt;沙箱与交付&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;runtime&quot; aria-pressed=&quot;false&quot;&gt;Runtime&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;ux&quot; aria-pressed=&quot;false&quot;&gt;UI / SSE&lt;/button&gt;
        &lt;button class=&quot;af-filter&quot; type=&quot;button&quot; data-filter-group=&quot;area&quot; data-filter-value=&quot;quality&quot; aria-pressed=&quot;false&quot;&gt;质量工程&lt;/button&gt;
      &lt;/div&gt;
      &lt;p class=&quot;af-print-note&quot;&gt;打印模式会忽略筛选并展示全部问题。&lt;/p&gt;
      &lt;div class=&quot;af-findings&quot;&gt;
        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-01&lt;small&gt;tenant boundary&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;实时运行控制面没有资源所有权校验&lt;/h3&gt;
            &lt;p&gt;&lt;code&gt;ActiveRun&lt;/code&gt; 不保存 tenantId，subscribe / abort / isActive 只按全局 runId 查 Map；路由先订阅 live run，再在找不到时才走带 tenant 的历史过滤。stop、inject 与 orphan finalize 也没有统一所有权检查。获取或猜到 ID 的另一租户可看到实时 transcript、终止运行或注入 HITL 消息。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;security&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;sse&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;mailbox&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;run-registry.ts:20-37, 84-109, 113-122, 222-224&lt;/code&gt;&lt;br&gt;&lt;code&gt;routes/v1/agent-factory.ts:258-281, 374-389&lt;/code&gt;&lt;br&gt;&lt;code&gt;mailbox.ts:28-43&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;所有控制函数强制接收 TenantContext；key 使用 tenantId + runId；跨租户统一 404；持久更新同时匹配 id 与 tenantId。用两租户对 reconnect / stop / inject / start 做负向集成测试。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-02&lt;small&gt;state isolation&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Conversation、Draft、Reflection、Skill、Tool、Policy 仍是全局资产&lt;/h3&gt;
            &lt;p&gt;多个 FactoryPorts 没有 tenant 维度。&lt;code&gt;factory_conversations&lt;/code&gt;、reflections、skills、tools 缺 tenant_id；draft 与 policy 文件只按 domain/slug 落盘；tool name 和 skill slug 还是全局主键。相同业务域或名称会跨租户读取、覆盖或晋升，且“业务 domain”被误当作工具归属。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;database&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;filesystem&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;poisoning&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;packages/db/src/schema.ts:817-845, 982-1023&lt;/code&gt;&lt;br&gt;&lt;code&gt;stores.ts:38-190&lt;/code&gt;&lt;br&gt;&lt;code&gt;agent-draft-store.ts:14-63&lt;/code&gt;&lt;br&gt;&lt;code&gt;policy-stats-store.ts:11-41&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;所有 port 的一等参数改为 TenantScope；DB 使用复合唯一键；文件路径改为 tenant/domain；共享资源显式标 visibility 与 owner。迁移前阻止跨租户 promote。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-03&lt;small&gt;code execution&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;生成代码通过 new Function 在 API / worker 主进程执行&lt;/h3&gt;
            &lt;p&gt;Runtime 仅检查 tenantSlug 是否以 &lt;code&gt;-sb&lt;/code&gt; 结尾，然后编译并在同一 Node 进程执行。AST deny-list 无法阻止读取 &lt;code&gt;process.env&lt;/code&gt;、全局网络、无限循环、内存炸弹或语义绕过。一次错误生成即可阻塞 event loop，并接触 DB 与 LLM 凭据。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;rce&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;availability&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;credentials&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;packages/runtime/src/codeact.ts:135-162&lt;/code&gt;&lt;br&gt;&lt;code&gt;packages/agent-factory/src/code-lint.ts:1-8, 121-153&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;真正隔离完成前关闭生成代码执行，只允许 declarative path；随后放入独立容器/microVM/受限进程，设置 CPU、内存、wall-clock、网络 allowlist、只读 FS 与无 secret 环境。用逃逸、死循环和内存测试验证。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;delivery&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-04&lt;small&gt;sandbox collision&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;同名 domain 的所有租户和运行共享一个 Sandbox&lt;/h3&gt;
            &lt;p&gt;沙箱 slug 固定为 &lt;code&gt;&amp;lt;domain&amp;gt;-sb&lt;/code&gt;，部署直接覆盖同一 manifest，观测主要按 tenant 与时间窗口过滤，teardown 会清空同一 workflow。两个并发工厂运行可互相覆盖部署、混入对方 runs/agent I/O，或在另一运行测试中途删除 functions。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;race&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;evidence&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;concurrency&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;sandbox-deployer.ts:125, 185-226, 253-325, 513-553&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;命名使用 originTenantId + factoryRunId；事件携带 correlationId；deploy/teardown 使用 lease 与 CAS；回收 orphan sandbox。执行两个租户同域并发 E2E，确保 manifest、run 与 teardown 全隔离。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;delivery&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-05&lt;small&gt;semantic parity&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;沙箱验证的代码路径与生产实际执行路径不同&lt;/h3&gt;
            &lt;p&gt;沙箱内生成代码可执行并产出 code receipt；晋升到正常 tenant 后 &lt;code&gt;runGeneratedCode&lt;/code&gt; 明确拒绝，Runtime 自动回退 generated prompt。工厂制造工具又按 business domain 保存，而生产 bootstrap 按 tenant slug/base 加载。绿色验收因此可能证明了一个生产永远不走的路径。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;verification&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;production drift&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;sandbox-deployer.ts:127-165&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/codeact.ts:135-143&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/step-engine.ts:598-612&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/bootstrap.ts:240-265&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;构建不可变 AgentBundle；sandbox 与 production 使用同一 execution adapter、同一 tool resolution、同一 bundle digest。若生产禁止代码，沙箱也必须验证 declarative path。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;runtime&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-06&lt;small&gt;durability&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;容器挂载的数据目录与代码实际读取的数据根不一致&lt;/h3&gt;
            &lt;p&gt;Compose/Docker 设置并挂载 &lt;code&gt;AGENTIC_DATA_DIR=/app/data&lt;/code&gt;，但 drafts、上传本体、policy、runtime blob、sandbox cassette 等读取 &lt;code&gt;AGENTIC_DATA_ROOT || ./data&lt;/code&gt;。API 工作目录是 &lt;code&gt;/app/apps/api&lt;/code&gt;，因此默认写到未挂载的 &lt;code&gt;/app/apps/api/data&lt;/code&gt;，容器替换后可能丢草稿、证据和 payload。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;docker&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;data loss&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;config&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;docker-compose.yml:54-59, 82-84&lt;/code&gt;&lt;br&gt;&lt;code&gt;apps/api/Dockerfile:91-98, 147&lt;/code&gt;&lt;br&gt;&lt;code&gt;agent-draft-store.ts:14-19&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/blob-store.ts&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;只保留一个 DATA_ROOT 配置并在启动时输出/校验解析后的绝对路径；所有 FS store 由统一 provider 注入。做容器重建与滚动升级持久性测试。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-07&lt;small&gt;authentication&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;生产缺 Session Secret 时回退到公开固定值&lt;/h3&gt;
            &lt;p&gt;&lt;code&gt;getSessionSecret()&lt;/code&gt; 无条件回退 &lt;code&gt;dev-only-do-not-use-in-prod&lt;/code&gt;，而生产启动安全检查只禁止 &lt;code&gt;AUTH_MODE=dev&lt;/code&gt;，不校验 secret 是否存在或足够随机。部署配置遗漏会让攻击者伪造或预测会话签名。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;auth&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;session&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;boot guard&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;apps/api/src/plugins/auth.ts:33-45, 304-320&lt;/code&gt;&lt;br&gt;&lt;code&gt;docs/DESIGN.md:1368-1375&lt;/code&gt; 与实现不一致&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;production 缺失或不足 32 随机字节即启动失败；支持带 key id 的多密钥轮换；CI/部署冒烟明确测试空值、短值和固定 fallback。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P0&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P0-08&lt;small&gt;cost control&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Factory 主 LLM 流绕过统一预算与完整遥测&lt;/h3&gt;
            &lt;p&gt;Agent Factory 直接创建 OpenAI-compatible SDK client，主 &lt;code&gt;streamTurn&lt;/code&gt; 没有进入集中 LLM Gateway 的 tenant budget hook；只有部分 &lt;code&gt;chatOnce&lt;/code&gt; 有 telemetry。默认 session token cap 可为空，最大 200 turns，模块级全局 call context 还会在并发 run 间产生归属竞态。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;cost&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;telemetry&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;concurrency&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory/stream-gateway.ts:41-57, 66-157, 200-341&lt;/code&gt;&lt;br&gt;&lt;code&gt;conductor.ts:214-229, 348-350&lt;/code&gt;&lt;br&gt;&lt;code&gt;llm-gateway/gateway.ts:119-154&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;所有 LLM 调用统一经 streaming gateway，强制 tenantId/runId/purpose；预算先原子预留后结算；用显式 context 或 AsyncLocalStorage。断言实际 SDK 调用数与 llm_calls 逐条一致。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-01&lt;small&gt;data model&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;runId 与 conversationId 合并，后续轮次覆盖历史&lt;/h3&gt;
            &lt;p&gt;&lt;code&gt;startRun&lt;/code&gt; 直接令 runId = conversationId；新一轮会 UPSERT 同一个 &lt;code&gt;factory_runs&lt;/code&gt; 主键，覆盖 goal、状态与 transcript，并可能保留上一轮 token/turn/agent 指标。schema 注释的“一次 brain run 一行”与真实行为相反，成本与验收无法按 attempt 追溯。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;history&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;provenance&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;run-registry.ts:113-142&lt;/code&gt;&lt;br&gt;&lt;code&gt;stores.ts:206-245&lt;/code&gt;&lt;br&gt;&lt;code&gt;schema.ts:946-979&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;拆分 conversation、immutable run、attempt/interaction；每条事件、LLM call、acceptance、draft version 引用 runId。多轮对话测试应保留每轮记录且指标不串线。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;delivery&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-02&lt;small&gt;fail-open gate&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;执行保真“未评估”会被 Acceptance 当作通过&lt;/h3&gt;
            &lt;p&gt;只有 real run 且采集到 agentRuns 时才计算 fidelityFailures；缺少 artifact、DB 读取失败或跨实例文件不可见时传入 undefined。Acceptance 随后把 undefined 变成空数组，&lt;code&gt;execution_fidelity&lt;/code&gt; 显示 pass，同时详情却写“未评估执行保真”。同一 fingerprint 的 rerun 还会把前次成功信号做 OR 合并，采样抖动虽不降级，却也可能保留陈旧绿色证据。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;false green&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;evidence&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory/tools.ts:1275-1283&lt;/code&gt;&lt;br&gt;&lt;code&gt;agent-factory/acceptance.ts:62-80&lt;/code&gt;&lt;br&gt;&lt;code&gt;sandbox-deployer.ts:389-446&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;三态结果 pass/fail/unknown；unknown 在 publish gate 中阻断。每条 criterion 必须附 evidence pointer、runId、bundle digest；证据读取失败与“确实没有失败”不可共用空数组。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-03&lt;small&gt;horizontal scale&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Registry、Mailbox、Report Job 没有跨实例 lease 或 durable queue&lt;/h3&gt;
            &lt;p&gt;运行、HITL 和 report 状态依赖进程内 Map。每个 API 实例启动都会扫描相同 running 行并尝试恢复，sweeper 也可能把另一实例的活跃运行判为 zombie；负载均衡把 stop/reconnect/inject 发到另一节点时无法找到资源。当前 checkpoint 与 5 秒 transcript mirror 是积极补丁，但不是 durable orchestration。auto-resume 仍在 ESM 包中直接调用 CommonJS &lt;code&gt;require&lt;/code&gt;，且外层 best-effort catch 可能让恢复静默不工作。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;ha&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;lease&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;recovery&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;run-registry.ts:39-40, 231-283&lt;/code&gt;（含 &lt;code&gt;require&lt;/code&gt;）&lt;br&gt;&lt;code&gt;mailbox.ts:23-55&lt;/code&gt;&lt;br&gt;&lt;code&gt;report-jobs.ts:61-113&lt;/code&gt;&lt;br&gt;&lt;code&gt;bootstrap.ts:210-214&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;HTTP 仅创建 command；worker 使用 leased_by/lease_until/heartbeat/attempt 原子 claim；SSE 从 append-only journal 回放；HITL 写 durable gate。双实例测试只能有一个 owner。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;delivery&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-04&lt;small&gt;promotion race&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Promotion 没有 live-version CAS，存在并发丢更新&lt;/h3&gt;
            &lt;p&gt;晋升流程先读取当前 live manifest，在内存 additive merge，再 validate/commit；提交时未核对读取时的 live deployment/version 是否仍是当前值。两个并发 promote 都可基于旧基线成功，后提交者覆盖先提交者的增量。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;deployment&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;lost update&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;promote.ts:24-50&lt;/code&gt;&lt;br&gt;&lt;code&gt;manifest-import.ts:825-860, 1092-1148&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;使用每租户部署 lease 和 &lt;code&gt;expectedLiveDeploymentId/version&lt;/code&gt; CAS；冲突返回 409，重新 rebase + validate。并发 promote 集成测试必须保留两边变更或明确拒绝一方。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;ux&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-05&lt;small&gt;stream lifecycle&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;SSE 心跳、前端 watchdog、重连和回放协议互相矛盾&lt;/h3&gt;
            &lt;p&gt;服务端每 15 秒发送 SSE 注释 &lt;code&gt;: ping&lt;/code&gt;，浏览器 &lt;code&gt;onmessage&lt;/code&gt; 不会收到；前端 60 秒 watchdog 却假定 keepalive 会刷新计时，而底层 LLM 静默超时是 90 秒。前端可能先关闭一个仍在运行的任务并解锁输入。服务端还缓存最多 100,000 帧、重连全量 replay、无 cursor/Last-Event-ID，写端忽略 backpressure。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;sse&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;false timeout&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;memory&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;routes/v1/agent-factory.ts:336-371&lt;/code&gt;&lt;br&gt;&lt;code&gt;useBrainStream.ts:79-125&lt;/code&gt;&lt;br&gt;&lt;code&gt;stream-gateway.ts:217&lt;/code&gt;&lt;br&gt;&lt;code&gt;run-registry.ts:39-70&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;心跳改为带 seq 的 data event；前端建立 connecting/live/reconnecting/terminal FSM；支持 after cursor 与 snapshot + delta；写端处理 drain/backpressure；瞬时断网不得把运行标为终态。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;runtime&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-06&lt;small&gt;version selection&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Manifest Loader 可能长期加载旧版本&lt;/h3&gt;
            &lt;p&gt;loader 优先返回目录中的 &lt;code&gt;workflow.json&lt;/code&gt;，因此它会永久遮蔽后续 &lt;code&gt;workflow_vN.json&lt;/code&gt;；没有 plain 文件时又做字符串倒序，&lt;code&gt;workflow_v9.json&lt;/code&gt; 会排在 &lt;code&gt;workflow_v10.json&lt;/code&gt; 前。数据库可显示新部署 live，但 Runtime 仍注册旧 functions。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;deployment drift&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;loader&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;packages/runtime/src/manifest.ts:231-259&lt;/code&gt;&lt;br&gt;&lt;code&gt;apps/api/src/services/manifest-import.ts:1048-1080&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;DB live deployment pointer 是唯一真相；按 version number 数值解析且校验 file hash。加入 workflow.json、v9、v10 共存回归测试，并核对注册函数 digest。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-07&lt;small&gt;authorization&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Promotion / Tool 变更、Token scope 与审计语义漂移&lt;/h3&gt;
            &lt;p&gt;promote 与生成工具删除只要求 &lt;code&gt;agents.invoke&lt;/code&gt;，但 operator 定义明确不应修改配置；AI analyze 会产生费用却只要求 read。Bearer scope 被折算为完整角色权限包，token schema 缺 expires/revoked/status。Factory 的 start/stop/inject/promote/report 等成功写操作也没有一致的 allow audit 与 actor context。认证解析未统一拒绝 archived tenant，归档前 active-work 检查又遗漏 factory runs/report jobs。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;rbac&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;token&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;audit&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory.ts:80-86, 132-145, 228-245&lt;/code&gt;&lt;br&gt;&lt;code&gt;permissions.ts:89-140&lt;/code&gt;&lt;br&gt;&lt;code&gt;auth.ts:157-194, 255-275&lt;/code&gt;&lt;br&gt;&lt;code&gt;queries/tenants.ts:291-323&lt;/code&gt;&lt;br&gt;&lt;code&gt;schema.ts:533-551&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;权限按动作最小化：invoke/read/write/deploy/analyze 分开；token 精确 scope + expiry/revocation；所有 mutation 写结构化 audit，包含 actor、tenant、run、resource、result 与 requestId。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;security&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-08&lt;small&gt;secret handling&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;测试凭据和 Tool headers 会进入明文 Conversation / DB&lt;/h3&gt;
            &lt;p&gt;Factory 会识别并索取 API key、access token、secret，把值存进 &lt;code&gt;testDataOverrides&lt;/code&gt;；完整 BrainCtx 每轮序列化写入 SQLite。Tool-Smith 的 raw HTTP headers 也写入 &lt;code&gt;factory_tools&lt;/code&gt;。当前没有 secret reference、字段级加密、自动脱敏或 TTL。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;pii&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;credentials&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;retention&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory/tools.ts:2057-2115&lt;/code&gt;&lt;br&gt;&lt;code&gt;conductor.ts:287-291&lt;/code&gt;&lt;br&gt;&lt;code&gt;stores.ts:74-89&lt;/code&gt;&lt;br&gt;&lt;code&gt;schema.ts:1003-1019&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;只保存 &lt;code&gt;secretRef&lt;/code&gt;，值进 Vault/KMS；conversation/transcript 落盘前按 schema redaction；测试 payload 使用短期凭据。迁移扫描并轮换历史泄露值。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;quality&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-09&lt;small&gt;quality gate&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;CI 配置看似完整，实际没有门禁 Factory 全链路&lt;/h3&gt;
            &lt;p&gt;CI 调用 &lt;code&gt;pnpm -r test:coverage&lt;/code&gt;，仓库只有 CLI 定义该 script；又调用 Web 不存在的 &lt;code&gt;test:e2e&lt;/code&gt;。root &lt;code&gt;pnpm test&lt;/code&gt; 实际只运行 agent-factory、API、CLI，不运行 Runtime/Web；Runtime 已存在测试文件，却没有 test script，手工运行还暴露默认 sandbox mode 断言失败。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;ci&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;coverage&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;false assurance&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;复现&lt;/strong&gt;&lt;code&gt;.github/workflows/ci.yml:121, 189&lt;/code&gt;&lt;br&gt;&lt;code&gt;apps/web/package.json&lt;/code&gt; 无 test:e2e&lt;br&gt;&lt;code&gt;packages/runtime/package.json&lt;/code&gt; 无 test script&lt;br&gt;手工 runtime sandbox-mode：4 pass / 1 fail&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;每个关键 workspace 必须有 test、coverage、contract/E2E script；CI 以显式矩阵执行并在 script 缺失时失败。新增跨租户、并发 sandbox、SSE 重连、promotion CAS 与生产 secret boot tests。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;runtime&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-10&lt;small&gt;durable semantics&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;硬异常和 Delay 没有完成 Durable Runtime 语义&lt;/h3&gt;
            &lt;p&gt;普通 tool/logic step 最终抛错时，非 soft 分支会 emit compensation 后再次 throw，但不一定先调用 &lt;code&gt;failRun&lt;/code&gt;，run 行可能停在 running 等 reconciler 清理。delay action 在 &lt;code&gt;step.run&lt;/code&gt; 内使用 &lt;code&gt;setTimeout&lt;/code&gt;，并不是 Inngest durable &lt;code&gt;step.sleep&lt;/code&gt;。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;runtime state&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;retry&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;timer&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;runtime/register.ts:634-757, 870-898, 1109-1161&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/step-engine.ts:669-680&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/manifest.ts:15-22&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;顶层 catch/finally 原子终结 run，再抛给调度器；延迟提升到 orchestrator step.sleep。用 worker 重启、重试耗尽和长延迟测试确认状态唯一终结。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P1&quot; data-area=&quot;ux&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P1-11&lt;small&gt;contract drift&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;BrainEvent 与 HITL 缺共享、版本化、幂等合同&lt;/h3&gt;
            &lt;p&gt;后端有 discriminated union，Web 却重新定义开放字典，只做 JSON.parse；帧没有统一 schemaVersion/runId/seq。HITL 依赖自由文本暗号，无 interactionId/revision/idempotency key；前端在服务端确认前先隐藏卡片，网络错误又被吞。跨业务域 reconnect 只传 id，不同步 domain，UI 与 checkpoint 可混合上下文。&lt;/p&gt;
            &lt;div&gt;&lt;span class=&quot;af-pill&quot;&gt;contract&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;hitl&lt;/span&gt;&lt;span class=&quot;af-pill&quot;&gt;ui state&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;brain-types.ts:149+&lt;/code&gt;&lt;br&gt;&lt;code&gt;useBrainStream.ts:15, 109&lt;/code&gt;&lt;br&gt;&lt;code&gt;interaction-dock.tsx:78-147&lt;/code&gt;&lt;br&gt;&lt;code&gt;factory/page.tsx:53, 314, 433&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复与验收&lt;/strong&gt;共享 Zod/JSON schema；帧带 schemaVersion/runId/seq/at；HITL 使用 interaction resource 与幂等 resolve API；只在 ack 后收起；checkpoint domain 不一致返回 409。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;runtime&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-01&lt;small&gt;schema contract&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;结构化 Prompt 输出校验失败后仍返回 ok:true&lt;/h3&gt;
            &lt;p&gt;AgentKit 的 &lt;code&gt;PromptDescriptor.output&lt;/code&gt; 声明结构化校验契约，但 Runtime 在 JSON parse 或 Zod 校验失败时保留 raw text 并继续成功。下游会收到与 manifest/schema 不一致的数据，错误只在更远处暴露。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-kit/src/types.ts:103-121&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/step-engine.ts:454-480&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;按 action policy 进行 structured-output retry；耗尽后明确 schema_error 并终结/补偿，禁止 raw text 冒充结构化成功。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-02&lt;small&gt;graph liveness&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;事件图只验“可达”，未验每个分支最终可终结&lt;/h3&gt;
            &lt;p&gt;当前要求入口、至少一个 terminal、所有节点从入口可达，但没有 SCC/cycle 分析，也不要求每个 reachable node 都能反向到达合法终态。一个分支可永久困在环中，只要图的另一处存在 terminal，静态门仍可能通过。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory/src/graph.ts:161-233&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;增加 SCC、non-terminating component 和 per-branch reverse reachability；允许循环必须有显式 bounded/retry/exit contract。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-03&lt;small&gt;ontology drift&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;本体漂移只比较数量，Sandbox fingerprint 不含本体 hash&lt;/h3&gt;
            &lt;p&gt;Rule 文本、event_data 字段、trigger/emit 或 DataObject property 内容改变，只要总数不变，旧 specs 仍会被视为基于同一版本。当前 sandbox evidence fingerprint 主要约束 specs，没有把 ontology snapshot digest 一并锁定。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;agent-factory/tools.ts:315-320&lt;/code&gt; 及 sandbox evidence fingerprint 生成路径&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;对 canonical ontology snapshot 做内容 hash；spec、test case、evidence、draft 与 deployment 全引用同一 hash。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;control&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-04&lt;small&gt;source semantics&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Allmeta 严格源失败后会静默退化到薄 Manifest&lt;/h3&gt;
            &lt;p&gt;OntologySource 接口与 Allmeta 实现强调 strict/no-fallback，但 Composite 在 Allmeta 失败时继续尝试本地 workflow artifact。artifact 可能只有 actions，缺 events/objects/rules；一次网络故障即可让生成依据悄然降级，而 UI 不一定知道。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;ports.ts:19-30&lt;/code&gt;&lt;br&gt;&lt;code&gt;composite-ontology-source.ts:76-87&lt;/code&gt;&lt;br&gt;&lt;code&gt;ontology-source.ts:177-195&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;严格模式失败即阻断；显式 degraded mode 必须展示 source/coverage/warnings，并禁止自动 publish。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;runtime&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-05&lt;small&gt;retry policy&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;Manifest action-level retries 被投影却未被 executor 消费&lt;/h3&gt;
            &lt;p&gt;Factory Plan 把 retries 写入每个 action，Runtime 注册函数却固定 &lt;code&gt;retries: 3&lt;/code&gt;。不同副作用、幂等性和补偿要求的步骤无法拥有独立策略，manifest 中的配置只是未生效数据。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;runtime/manifest.ts:36-44&lt;/code&gt;&lt;br&gt;&lt;code&gt;agent-factory/plan-projection.ts:77-96&lt;/code&gt;&lt;br&gt;&lt;code&gt;runtime/register.ts:190-205&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;明确 retries 属于 function 还是 action；若按 action，执行器内实现稳定 step id、attempt 与 idempotency；否则从 IR 删除误导字段。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;ux&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-06&lt;small&gt;http semantics&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;用 GET URL 启动昂贵任务，并携带 goal 与附件正文&lt;/h3&gt;
            &lt;p&gt;EventSource query 直接带 goal，UI 还会拼入最多三份文档正文。URL 会进入浏览器历史、反向代理和 access log，也受 URL 长度限制；GET 却创建 run、调用 LLM、写 DB 和部署沙箱，缺少 idempotency 与正确命令语义。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;useBrainStream.ts:79-87&lt;/code&gt;&lt;br&gt;&lt;code&gt;factory-stream/route.ts:19-44&lt;/code&gt;&lt;br&gt;&lt;code&gt;factory/page.tsx:292-311&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;&lt;code&gt;POST /factory-runs&lt;/code&gt; 接收 body 与 idempotency key，返回服务端 runId；SSE URL 只带 runId 与 cursor。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;quality&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-07&lt;small&gt;scale &amp; maintain&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;长流、全量序列化和 God modules 会放大规模化成本&lt;/h3&gt;
            &lt;p&gt;每个 token delta 在 Web 复制完整 events 数组并重复全量投影；服务端每 5 秒复制并重写完整 transcript JSON。核心 &lt;code&gt;tools.ts&lt;/code&gt; 约 2,300 行，&lt;code&gt;conductor.ts&lt;/code&gt; 已超过 1,000 行，Factory 页面约 680 行，职责和变更冲突高度集中；factory_runs 热路径索引与 retention 也不足。多个文件 store 直接写目标文件，损坏又常被静默当成“无数据”；全局 rate limiter 仍是进程内 Map，多副本时配额会按实例倍增。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;useBrainStream.ts:125&lt;/code&gt;&lt;br&gt;&lt;code&gt;factory/page.tsx:170&lt;/code&gt;&lt;br&gt;&lt;code&gt;run-registry.ts:147-154&lt;/code&gt;&lt;br&gt;相关实现统计约 21,026 行&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;token 合批、增量 reducer、虚拟化、append-only events + 周期 snapshot；按 stage/tool family 拆核心模块；增加 tenant/run/updated_at 索引与 retention。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-finding&quot; data-severity=&quot;P2&quot; data-area=&quot;quality&quot;&gt;
          &lt;div class=&quot;af-severity&quot;&gt;P2-08&lt;small&gt;docs &amp; ingestion&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;af-finding-body&quot;&gt;
            &lt;h3&gt;文档/运行基线漂移，上传本体分类又过于宽松&lt;/h3&gt;
            &lt;p&gt;README 仍写 Node 22、pnpm 10、Next 15、API 3501，而当前 package 要求 Node ≥26、pnpm 11.3、Next 16.2、API 默认 3540。UI 对“对象数组首项含 name 或 id”就判为 ontology，普通业务记录 JSON 可能直接覆盖当前域的上传 overlay。&lt;/p&gt;
            &lt;div class=&quot;af-finding-meta&quot;&gt;
              &lt;div class=&quot;af-evidence&quot;&gt;&lt;strong&gt;代码证据&lt;/strong&gt;&lt;code&gt;README.md&lt;/code&gt; 对比 &lt;code&gt;package.json&lt;/code&gt; 与 app packages&lt;br&gt;&lt;code&gt;ontology-upload.ts:48&lt;/code&gt;&lt;br&gt;&lt;code&gt;ontology-upload.test.ts:70&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;af-remedy&quot;&gt;&lt;strong&gt;修复&lt;/strong&gt;生成单一版本矩阵并由 CI 校验；上传本体使用严格 schema、分类预览、版本确认与 rollback，参考文档与 ontology 上传拆开。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-strengths&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;What should be preserved&lt;/p&gt;&lt;h2&gt;不应在整改中丢掉的 7 个优点&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;风险集中不代表底层方向错误。以下结构已经降低了重构成本，应在目标架构中保留并强化。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-grid af-grid-3&quot;&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;Ports 解耦&lt;/h3&gt;&lt;p&gt;Factory 核心通过 Ontology、Sandbox、Conversation、Reflection、Tool、Draft 等端口与 Fastify/Drizzle/Inngest 分离，便于替换实现和测试。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;草稿 / 生产边界&lt;/h3&gt;&lt;p&gt;&lt;code&gt;finish&lt;/code&gt; 只保存 draft，显式 Promote 才进入 live manifest，生成并不会自动上线。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;多层验证骨架&lt;/h3&gt;&lt;p&gt;已有 graph closure、field contract、action coverage、rule gate、critique、sandbox run 和 acceptance，不是只看 LLM 自评。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;长运行治理&lt;/h3&gt;&lt;p&gt;compaction、ontology anchor、stage admission、重复工具熔断、HITL、checkpoint 与 transcript mirror 都已存在。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;Runtime Durable 骨架&lt;/h3&gt;&lt;p&gt;per-tenant Inngest、stable step id、condition gating、tasks、compensation、correlation、artifacts 和 event store 已具雏形。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;AgentKit 边界小&lt;/h3&gt;&lt;p&gt;&lt;code&gt;defineTool&lt;/code&gt;、&lt;code&gt;definePrompt&lt;/code&gt;、&lt;code&gt;TenantRegistry&lt;/code&gt; 没有反向依赖 Runtime，扩展契约清楚。&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;af-card af-positive&quot;&gt;&lt;h3&gt;近期恢复补丁&lt;/h3&gt;&lt;p&gt;审计快照已包含每轮 checkpoint、5 秒 transcript mirror、恢复 tenantSlug 与显式恢复哨兵，单机崩溃恢复能力在改善。&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-target&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Target architecture&lt;/p&gt;&lt;h2&gt;建议目标架构：四个平面 + 一个不可变制品&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;关键不是增加更多服务，而是把 TenantContext、Run Attempt、Bundle Digest 和 Evidence Pointer 变成跨平面的强制主键。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-diagram&quot; role=&quot;img&quot; aria-label=&quot;Agent Factory 建议目标架构图&quot;&gt;
        &lt;svg viewBox=&quot;0 0 1240 690&quot; preserveAspectRatio=&quot;xMidYMid meet&quot;&gt;
          &lt;title&gt;Agent Factory 建议目标架构&lt;/title&gt;
          &lt;desc&gt;命令接入、Durable Orchestrator、隔离验证、原子部署和生产 Runtime 通过不可变 AgentBundle 连接。&lt;/desc&gt;

        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;AgentBundle 必须包含&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;ontology snapshot version + content hash&lt;/li&gt;
            &lt;li&gt;GeneratedAgentSpec + runtime manifest&lt;/li&gt;
            &lt;li&gt;tool / prompt / secret references，不含明文值&lt;/li&gt;
            &lt;li&gt;code artifact 或明确 declarative execution mode&lt;/li&gt;
            &lt;li&gt;test cases、case run IDs、payload evidence&lt;/li&gt;
            &lt;li&gt;acceptance report、bundle digest/signature&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;af-card&quot;&gt;
          &lt;h3&gt;跨层不可违反的 8 条不变量&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;每个资源操作都携带 TenantContext。&lt;/li&gt;
            &lt;li&gt;每次执行都有新的 immutable runId。&lt;/li&gt;
            &lt;li&gt;HTTP 连接断开不改变 run 归属或终态。&lt;/li&gt;
            &lt;li&gt;同一 sandbox lease 只属于一个 tenant/run。&lt;/li&gt;
            &lt;li&gt;Sandbox 与生产执行同一 bundle digest。&lt;/li&gt;
            &lt;li&gt;Acceptance unknown 绝不等于 pass。&lt;/li&gt;
            &lt;li&gt;Live deployment 只能经 CAS 原子推进。&lt;/li&gt;
            &lt;li&gt;Secret 永远以引用进入制品与 transcript。&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-roadmap&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Remediation roadmap&lt;/p&gt;&lt;h2&gt;建议整改顺序与验收门&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;时间是建议排序窗口，不是对具体团队产能的承诺。每一阶段都以可自动验证的 release gate 收口。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-roadmap&quot;&gt;
        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Phase 0&lt;/div&gt;&lt;small&gt;0–3 天&lt;br&gt;立即止血&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;先让系统“不能越界、不能误持久、不能在主进程跑任意代码”&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;生产启动强校验 session secret；删除固定 fallback。&lt;/li&gt;
              &lt;li&gt;live reconnect / stop / inject / start / finalize 全部验证 tenant ownership。&lt;/li&gt;
              &lt;li&gt;关闭 &lt;code&gt;new Function&lt;/code&gt; CodeAct，强制 declarative-only。&lt;/li&gt;
              &lt;li&gt;统一 AGENTIC_DATA_ROOT，并确认容器 volume 真正覆盖。&lt;/li&gt;
              &lt;li&gt;Acceptance 的 unknown 改为 blocking；同域 sandbox 暂加全局互斥直到唯一命名完成。&lt;/li&gt;
              &lt;li&gt;限制 Factory 单 run token/turn/cost，并临时串行化 tenant LLM 工作。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;Release gate&lt;/strong&gt;&lt;br&gt;两租户负向控制测试 100% 通过；无/短 secret 启动失败；生成代码无法触达主进程；容器重建后 draft/evidence 仍存在；缺证据不能 promote。&lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Phase 1&lt;/div&gt;&lt;small&gt;1–2 周&lt;br&gt;模型纠偏&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;把租户、运行、证据和部署版本建模正确&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;所有 Factory schema/port 增 tenant_id；迁移 drafts/policy/tools/skills/reflections。&lt;/li&gt;
              &lt;li&gt;conversationId、runId、attempt/interactionId 分离，历史只追加不覆盖。&lt;/li&gt;
              &lt;li&gt;Sandbox 使用 tenant + run 唯一 slug、correlationId、lease/CAS 与幂等 teardown。&lt;/li&gt;
              &lt;li&gt;Factory 全量接入统一 streaming LLM Gateway 和预算/遥测。&lt;/li&gt;
              &lt;li&gt;Promotion 加 expected live version CAS；Runtime 只读 DB live pointer。&lt;/li&gt;
              &lt;li&gt;共享并版本化 BrainEvent/HITL contract；SSE 支持 seq/cursor。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;Release gate&lt;/strong&gt;&lt;br&gt;同域并发沙箱互不干扰；两轮 conversation 产生两条 run；SDK 调用数等于 telemetry 行数；并发 promote 一方 409；v9/v10 与 workflow.json 共存仍加载 live digest。&lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Phase 2&lt;/div&gt;&lt;small&gt;3–6 周&lt;br&gt;生产化&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;将控制面推进为 Durable Orchestration 与不可变交付&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;命令 API + durable worker + run lease + append-only event journal。&lt;/li&gt;
              &lt;li&gt;隔离执行容器/microVM，CPU/RAM/time/network/FS 全约束。&lt;/li&gt;
              &lt;li&gt;AgentBundle registry；sandbox、acceptance、deployment 校验同一 digest。&lt;/li&gt;
              &lt;li&gt;Factory 状态迁移到 Postgres，共享制品进入 object store，凭据进入 Vault。&lt;/li&gt;
              &lt;li&gt;Runtime hard failure 原子终结、durable sleep、outbox 与结构化输出失败策略。&lt;/li&gt;
              &lt;li&gt;全链 OTel：tenant/run/conversation/model/tool/event causation。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;Release gate&lt;/strong&gt;&lt;br&gt;API/worker 重启不中断或重复副作用；隔离逃逸测试通过；deployment digest 与 sandbox digest 完全一致；事件发布和 DB 状态无双写窗口；生产演练可回滚到指定 bundle。&lt;/div&gt;
        &lt;/article&gt;

        &lt;article class=&quot;af-phase&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;af-phase-tag&quot;&gt;Phase 3&lt;/div&gt;&lt;small&gt;持续&lt;br&gt;规模与治理&lt;/small&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;h3&gt;性能、治理和可维护性收敛&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;流式 delta 合批、增量 reducer、虚拟化、snapshot + cursor replay。&lt;/li&gt;
              &lt;li&gt;learning assets 增 version/approval/rollback/visibility。&lt;/li&gt;
              &lt;li&gt;拆分 tools/conductor/page god modules，建立 stage ownership。&lt;/li&gt;
              &lt;li&gt;retention、GDPR/PII 删除、secret rotation、archive tenant guard。&lt;/li&gt;
              &lt;li&gt;容量基线：并发 run、最大帧、artifact、token、sandbox quota。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;af-accept&quot;&gt;&lt;strong&gt;Release gate&lt;/strong&gt;&lt;br&gt;10k–100k 帧长流不出现二次渲染增长；资源配额跨实例一致；归档租户无法继续认证或启动 Factory 工作；关键模块复杂度与覆盖率进入 CI 门槛。&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;af-validation&quot;&gt;
      &lt;div class=&quot;af-section-head&quot;&gt;
        &lt;div&gt;&lt;p class=&quot;af-eyebrow&quot;&gt;Verification record&lt;/p&gt;&lt;h2&gt;本次实际验证与边界&lt;/h2&gt;&lt;/div&gt;
        &lt;p&gt;“测试通过”只说明被执行的范围。下面把执行结果、未覆盖区域和环境偏差分开列出。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;af-table-wrap&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;验证项&lt;/th&gt;&lt;th&gt;结果&lt;/th&gt;&lt;th&gt;含义&lt;/th&gt;&lt;th&gt;限制 / 异常&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
