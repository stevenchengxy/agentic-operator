  &lt;p id=&quot;afh-detail&quot; class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;端到端：&lt;/strong&gt;Chatbot 驱动自治 Harness；Harness 生成结构化 Agent IR；通用 Runtime 将 IR 编译为 Inngest functions；真实执行证据再驱动下一版 IR。&lt;/p&gt;

  &lt;script&gt;
    (function () {
      var root = document.getElementById(&quot;af-harness-v2&quot;);
      if (!root) return;
      var detail = root.querySelector(&quot;#afh-detail&quot;);
      var viewButtons = root.querySelectorAll(&quot;[data-afh-view]&quot;);
      var panels = root.querySelectorAll(&quot;[data-afh-panel]&quot;);
      var summaries = {
        full: &quot;&lt;strong&gt;端到端：&lt;/strong&gt;Chatbot 驱动自治 Harness；Harness 生成结构化 Agent IR；通用 Runtime 将 IR 编译为 Inngest functions；真实执行证据再驱动下一版 IR。&quot;,
        review: &quot;&lt;strong&gt;审查返修：&lt;/strong&gt;设计内环可直接自动修一次；三重 Review 和 Sandbox 返修由外层 ReAct 大脑自治编排；快照、分数、预算和指纹防止无限磨损与旧证据复用。&quot;,
        inngest: &quot;&lt;strong&gt;Inngest 编译：&lt;/strong&gt;LLM 不生成 createFunction 外壳；它生成 Spec、Plan 和可选 handler。mapToManifest 与 registerAgent 负责稳定的 durable wrapper。&quot;
      };
      viewButtons.forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          var name = button.getAttribute(&quot;data-afh-view&quot;);
          viewButtons.forEach(function (item) {

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
